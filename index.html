.backup{margin-left:auto;display:flex;gap:6px}.backup button{font-size:12px;padding:5px 8px}time{margin-left:8px}.warn{background:#ffedc1;padding:12px;border-radius:7px}@media(max-width:600px){header time{display:none}}button.metric{display:block;text-align:left;min-height:90px;touch-action:manipulation}.filterChip{grid-column:1/-1;justify-self:start;color:#265bb5}.mathblock{display:block;max-width:100%;overflow-x:auto;padding:.45em .2em}.mathline{display:inline-block;max-width:100%;vertical-align:middle;overflow-x:auto}.mathblock math,.mathline math{font-weight:normal;font-size:1.12em;font-family:math,"Cambria Math",serif}.formulaInput{margin:12px 0}.formulaLabel{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.formulaLabel label{margin:0}.formulaLabel button{color:#2458a3;font-size:12px}.formulaInput textarea{display:block;width:100%}.formulaHint,.mathPreview{color:#41516a;background:#f4f7fb;padding:9px;border-radius:6px;font-size:13px}.mathPreview{white-space:pre-wrap;margin-top:5px}.dialog{overscroll-behavior:contain}.dialog .sectionhead{z-index:1}.dialog .sectionhead button,.nav,.hamb{min-height:42px}.row .mathblock{padding:0}.wire{pointer-events:none}aside{overflow-y:auto}header .backup{flex-shrink:0}@media(max-width:570px){.dbody textarea,.dbody input,.dbody select{font-size:16px}.dialog{max-height:94dvh}.overlay{padding:8px}header{flex-wrap:wrap;height:auto;min-height:52px;padding:6px 10px}.metric{min-width:0}.row{min-height:48px}.mathblock math{font-size:1em}} </style><body><div id="root"><h1>拾知 · 本地复习工作台</h1><p>若只看到这行文字，请用支持 JavaScript 的浏览器打开此 HTML 文件。</p></div><script type="application/json" id="public-questions">[{"id":"20261109-signal-4","subject":"信号与系统","chapter":"冲激抽样、频谱周期延拓与重建","type":"综合计算题","question":"信号第 4 大题｜\\(x(t)=2\\sin(4\\pi t)+\\cos(3\\pi t)\\) 与周期冲激串 \\(p(t)=\\sum_{n=-\\infty}^{\\infty}\\delta(t-nT)\\) 相乘，\\(T=\\frac23\\,\\mathrm{s}\\)，再依次通过 \\(H_1,H_2\\)。理想低通 \\(H_2\\) 的通带增益为 \\(T\\)，截止角频率为 \\(3.5\\pi\\,\\mathrm{rad/s}\\)。\n① 是否混叠？② 当 \\(H_1(j\\omega)=1\\) 时求 \\(x_r(t)\\)。③ 当 \\(H_1(j\\omega)=j\\omega/2\\) 时求 \\(x_r(t)\\)。","solution":"① 会混叠。抽样角频率 \\(\\omega_s=2\\pi/T=3\\pi\\)，原信号最高角频率为 \\(4\\pi\\)。取样时 \\(\\cos(3\\pi nT)=1\\)，余弦与直流有相同样值；正弦的样值满足 \\(\\sin(4\\pi nT)=\\sin(\\pi nT)\\)。\n\n② 一个基本频带对应 \\(1+2\\sin(\\pi t)\\)。抽样谱以 \\(3\\pi\\) 为间隔重复。低通放行 \\(|\\omega|\\le3.5\\pi\\)，还需计入相邻副本。直流复制到 \\(\\pm3\\pi\\)，合成 \\(2\\cos(3\\pi t)\\)。原来在 \\(-\\pi\\) 的负频谱线移到 \\(+2\\pi\\)，产生 \\(-2\\sin(2\\pi t)\\)。抽样系数 \\(1/T\\) 与通带增益 \\(T\\) 相消，故\n\\[x_r(t)=1+2\\cos(3\\pi t)+2\\sin(\\pi t)-2\\sin(2\\pi t).\\]\n\n③ 多乘 \\(j\\omega/2\\) 相当于把②的完整输出求导再除以 2。直流项的导数为零，得到\n\\[x_r(t)=\\pi\\cos(\\pi t)-2\\pi\\cos(2\\pi t)-3\\pi\\sin(3\\pi t).\\]"},{"id":"20261109-m34-02","subject":"高等数学","chapter":"无穷级数：递推数列与正项级数判敛","type":"选择题","question":"卷三十四 · 第 2 题｜设 \\(u_0=0,\\ u_{n+1}=\\sqrt{2+u_n}\\)，判定级数 \\(\\sum_{n=1}^{\\infty}(-1)^n\\sqrt{2-u_n}\\) 的敛散性。\nA 条件收敛；B 绝对收敛；C 发散；D 无法判断。","solution":"答案 B，绝对收敛。\n由递推式归纳可得 \\(0\\le u_n\u003c2\\)。令 \\(a_n=\\sqrt{2-u_n}>0\\)。利用平方差：\n\\[(2-u_{n+1})(2+u_{n+1})=4-u_{n+1}^2=2-u_n.\\]\n于是\n\\[\\frac{a_{n+1}}{a_n}=\\frac{1}{\\sqrt{2+u_{n+1}}}\\le\\frac1{\\sqrt2}\u003c1.\\]\n从而 \\(a_n\\le a_1(1/\\sqrt2)^{n-1}\\)。与收敛的几何级数比较，\\(\\sum a_n\\) 收敛，故原级数绝对收敛。仅用交错级数判别法不能区分 A、B。"},{"id":"20261109-m34-04","subject":"微分方程","chapter":"一阶线性微分方程与极值判定","type":"选择题","question":"卷三十四 · 第 4 题｜\\(y=f(x)\\) 满足 \\(y'-P(x)y=\\frac12e^x-1\\)，\\(y(0)=1\\)，其中 \\(P(x)=\\int_0^1|x-t|\\,dt\\)。判断：\nA 在 0 处取极大值；B 在 0 处取极小值；C 点 \\((0,f(0))\\) 为拐点；D 两者均非。","solution":"答案 A，\\(x=0\\) 为严格极大值点。\n① \\(P(0)=1/2\\)，代回方程得 \\(y'(0)=1/2+1/2-1=0\\)。\n② 在零点两侧去掉绝对值。\\(x\u003c0\\) 时 \\(P(x)=1/2-x\\)；\\(0\\le x\\le1\\) 时在 \\(t=x\\) 处分段，得到 \\(P(x)=x^2-x+1/2\\)。两侧导数在零点一致，\\(P'(0)=-1\\)。\n③ 原方程求导，得 \\(y''=P'y+Py'+e^x/2\\)。故\n\\[y''(0)=(-1)\\cdot1+\\frac12\\cdot0+\\frac12=-\\frac12\u003c0.\\]\n结合 \\(y'(0)=0\\) 即可判定极大值。"},{"id":"20261109-m34-06","subject":"线性代数","chapter":"幂零矩阵、秩与非齐次方程组","type":"选择题","question":"卷三十四 · 第 6 题｜\\(A\\) 为三阶非零矩阵，\\(b\\) 为三维非零列向量，\\(A^2=O\\)。非齐次方程组 \\(A^{\\mathsf T}Ax=A^{\\mathsf T}b\\) 最多有几个线性无关的解向量？\nA 1；B 2；C 3；D 4。","solution":"答案 C，共 3 个。按题干“非齐次”，有 \\(A^{\\mathsf T}b\\ne0\\)。\n① \\(A^2=O\\) 给出 \\(\\operatorname{Im}A\\subseteq\\ker A\\)。令 \\(r=\\operatorname{rank}A\\)，则 \\(r\\le3-r\\)。又 \\(A\\ne O\\)，故 \\(r=1\\)。\n② 由 \\(x^{\\mathsf T}A^{\\mathsf T}Ax=\\|Ax\\|^2\\) 得 \\(\\ker(A^{\\mathsf T}A)=\\ker A\\)，齐次解空间为二维。又 \\(\\operatorname{Im}(A^{\\mathsf T}A)\\subseteq\\operatorname{Im}(A^{\\mathsf T})\\) 且维数相等，故存在特解 \\(p\\)。\n③ 取齐次解空间的一组基 \\(u,v\\)。特解 \\(p\\notin\\operatorname{span}(u,v)\\)，因此 \\(p,p+u,p+v\\) 都是非齐次解且线性无关。在三维空间至多取三个。\n注意：仅由 \\(b\\ne0\\) 推不出 \\(A^{\\mathsf T}b\\ne0\\)。若右端为零，最多只有两个线性无关的解。"},{"id":"20261109-m34-13","subject":"高等数学","chapter":"傅里叶级数：周期与余弦系数","type":"填空题","question":"卷三十四 · 第 13 题｜函数\n\\[f(x)=\\begin{cases}x^2,&0\\le x\u003c1,\\\\2-x,&1\\le x\\le2.\\end{cases}\\]\n其傅里叶级数为 \\(S(x)=\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}[a_n\\cos(n\\pi x)+b_n\\sin(n\\pi x)]\\)。求 \\(a_2\\)。","solution":"答案 \\(a_2=\\frac{1}{2\\pi^2}\\)。\n基频为 \\(\\pi\\)，周期 \\(T=2\\)，故系数前的因子 \\(2/T=1\\)。令 \\(k=2\\pi\\)，在分段点拆开积分：\n\\[a_2=\\int_0^1 x^2\\cos(kx)\\,dx+\\int_1^2(2-x)\\cos(kx)\\,dx.\\]\n第一段分部积分两次，得到\n\\[\\left[\\frac{x^2\\sin(kx)}k+\\frac{2x\\cos(kx)}{k^2}-\\frac{2\\sin(kx)}{k^3}\\right]_0^1=\\frac2{k^2}.\\]\n第二段为\n\\[\\left[\\frac{(2-x)\\sin(kx)}k-\\frac{\\cos(kx)}{k^2}\\right]_1^2=0.\\]\n合并得 \\(a_2=2/(2\\pi)^2=1/(2\\pi^2)\\)。这里 \\(n=2\\) 对应的基函数是 \\(\\cos(2\\pi x)\\)。"},{"id":"20261111-math-14","subject":"微分方程","chapter":"常系数齐次微分方程、曲率圆与初始条件","type":"填空题","question":"第 14 题｜函数 \\(y(x)\\) 是微分方程 \\(y'''-3y''+3y'-y=0\\) 的解，且曲线在点 \\((0,0)\\) 的曲率圆为 \\((x-1)^2+(y-1)^2=2\\)。求 \\(y(x)\\)。","solution":"答案\n\\[y(x)=(2x^2-x)e^x.\\]\n① 特征方程为 \\(r^3-3r^2+3r-1=(r-1)^3=0\\)，故通解为\n\\[y(x)=(C_1+C_2x+C_3x^2)e^x.\\]\n② 曲线经过原点，所以 \\(y(0)=0\\)。曲率圆圆心为 \\((1,1)\\)，从原点到圆心的连线是曲线的法线，斜率为 1，切线斜率为 \\(-1\\)，即 \\(y'(0)=-1\\)。\n③ 求二阶导数的符号和数值。圆在原点附近的分支是\n\\[y_c(x)=1-\\sqrt{2-(x-1)^2}.\\]\n原点处位于圆的下半部分，曲线向上弯，故 \\(y''(0)>0\\)。曲率半径公式给出\n\\[R=\\frac{[1+(y')^2]^{3/2}}{|y''|},\\qquad \\sqrt2=\\frac{(1+1)^{3/2}}{|y''(0)|}.\\]\n因此 \\(y''(0)=2\\)。也可由曲率圆圆心纵坐标公式 \\(1=0+[1+(-1)^2]/y''(0)\\) 直接得到。\n④ 对通解代初始条件：\n\\[C_1=0,\\qquad C_1+C_2=-1,\\qquad C_1+2C_2+2C_3=2.\\]\n解得 \\(C_2=-1,C_3=2\\)，得到答案。\n注意：半径公式含绝对值，必须结合圆心位置判断二阶导数正负。"},{"id":"20261111-math-16","subject":"概率统计","chapter":"不放回抽样、离散分布与数学期望","type":"填空题","question":"第 16 题｜\\(n\\ (n>3)\\) 个乒乓球中有 3 只黄球、\\(n-3\\) 只白球，随机放入编号为 \\(1,2,\\ldots,n\\) 的 \\(n\\) 个盒子，每盒一个球。从第 1 号盒子起逐个打开，直到出现两个黄球为止。记 \\(X\\) 为打开的盒子数，求 \\(E(X)\\)。","solution":"答案\n\\[E(X)=\\frac{n+1}{2}.\\]\n方法一：列概率分布再求和。\n三只黄球的位置构成从 \\(n\\) 个位置中任选 3 个的等可能组合，总数为 \\(\\binom n3\\)。\n事件 \\(X=k\\) 要求第 \\(k\\) 个位置是第二只黄球：在前 \\(k-1\\) 个位置选一只黄球的位置，在后 \\(n-k\\) 个位置选第三只黄球的位置。因此\n\\[P(X=k)=\\frac{(k-1)(n-k)}{\\binom n3},\\qquad k=2,3,\\ldots,n-1.\\]\n这里必须在第 \\(k\\) 个盒子之后仍留有一只黄球，故最大取值为 \\(n-1\\)。\n计算期望：\n\\[E(X)=\\frac{\\sum_{k=2}^{n-1}k(k-1)(n-k)}{\\binom n3}.\\]\n利用 \\(k(k-1)=2\\binom k2\\) 和组合恒等式\n\\[\\sum_{k=2}^{n-1}\\binom k2(n-k)=\\binom{n+1}{4},\\]\n得 \\(E(X)=2\\binom{n+1}{4}/\\binom n3=(n+1)/2\\)。\n该恒等式可这样理解：从 \\(1,\\ldots,n+1\\) 选 4 个数，若第三个数为 \\(k+1\\)，前两个数有 \\(\\binom k2\\) 种，最后一个数有 \\(n-k\\) 种。\n也可直接用幂和计算：\n\\[\\sum_{k=1}^{n}k(k-1)(n-k)=(n+1)\\sum_{k=1}^{n}k^2-\\sum_{k=1}^{n}k^3-n\\sum_{k=1}^{n}k=\\frac{n(n-1)(n-2)(n+1)}{12}.\\]\n\n方法二：位置对称。\n把位置 \\(j\\) 映到 \\(n+1-j\\)，第二只黄球仍是三只黄球的中间一只，其位置从 \\(X\\) 变为 \\(n+1-X\\)。两者同分布，因此 \\(E(X)=n+1-E(X)\\)，也得到上述答案。"},{"id":"20261113-math-03","subject":"高等数学","chapter":"多元函数：可微性、偏导数与有界性","type":"选择题","question":"亚瑟精选模拟卷 · 第3题｜下列函数在原点不可微，且 \\(f_x(x,y)\\) 在原点的邻域内有界的是？\nA. \\(f(x,y)=\\sqrt{|xy|}\\)；\nB. \\(f(x,y)=|xy|\\)；\nC. \\(f(x,y)=\\sqrt[3]{xy}\\)；\nD. \\(f(x,y)=\\begin{cases}\\dfrac{xy}{\\sqrt{x^2+y^2}},&x^2+y^2\\ne0,\\\\0,&x^2+y^2=0.\\end{cases}\\)","solution":"答案 D。\nD 在原点的两个偏导数都是 0。沿 \\(x=y=t\\)，有 \\(f(t,t)=|t|/\\sqrt2\\)，从而\n\\[\\frac{f(t,t)-f(0,0)-0t-0t}{\\sqrt{t^2+t^2}}=\\frac12\\ne0,\\]\n故不可微。\n非原点处\n\\[f_x(x,y)=\\frac{y^3}{(x^2+y^2)^{3/2}},\\qquad |f_x(x,y)|\\le1.\\]\n结合 \\(f_x(0,0)=0\\)，邻域内有界。\nA 在 \\(xy\\ne0\\) 时偏导绝对值为 \\(\\frac12\\sqrt{|y|/|x|}\\)，可任意大，且部分坐标轴处偏导不存在。\nB 满足 \\(|xy|\\le(x^2+y^2)/2\\)，所以在原点可微，微分为 0。\nC 在 \\(xy\\ne0\\) 时偏导绝对值为 \\(|y|^{1/3}/(3|x|^{2/3})\\)，在任意原点邻域内无界。\n易混点：偏导数有界不等于偏导数连续，也不能据此推出可微。"},{"id":"20261113-math-06","subject":"线性代数","chapter":"正定二次型、迹与分块矩阵的秩","type":"选择题","question":"亚瑟精选模拟卷 · 第6题｜\\(A,B,C\\) 为 \\(n\\) 阶实矩阵，\\(A^{\\mathsf T}=A\\)，对任意非零列向量 \\(X\\)，均有\n\\[\\operatorname{tr}(ABXX^{\\mathsf T})+\\operatorname{tr}(XX^{\\mathsf T}AB)>0.\\]\n矩阵\n\\[\\begin{pmatrix}AB&O\\\\B&BC\\end{pmatrix},\\quad\n\\begin{pmatrix}B&A\\\\O&AC\\end{pmatrix},\\quad\n\\begin{pmatrix}A&C\\\\O&AB\\end{pmatrix}\\]\n的秩依次为 \\(r_1,r_2,r_3\\)，判断：\nA. \\(r_1\\ge r_2\\ge r_3\\)；B. \\(r_1\\ge r_3\\ge r_2\\)；\nC. \\(r_3\\ge r_1=r_2\\)；D. \\(r_2\\ge r_3=r_1\\)。","solution":"答案 C。\n利用迹的循环性质，题设等价于 \\(2X^{\\mathsf T}ABX>0\\)。若 \\(AB\\) 奇异，可取非零 \\(X\\) 使 \\(ABX=0\\)，与不等式矛盾。所以 \\(AB\\)、\\(A\\)、\\(B\\) 均可逆。\n第一个分块矩阵，用第二块行减去 \\(A^{-1}\\) 乘第一块行：\n\\[\\begin{pmatrix}AB&O\\\\B&BC\\end{pmatrix}\\sim\\begin{pmatrix}AB&O\\\\O&BC\\end{pmatrix}.\\]\n故 \\(r_1=n+r(C)\\)。\n第二个矩阵，用第二块列减去第一块列右乘 \\(B^{-1}A\\)，得对角块 \\(B,AC\\)，故 \\(r_2=n+r(C)\\)。\n第三个为分块上三角矩阵，两个对角块 \\(A,AB\\) 均可逆，故 \\(r_3=2n\\)。\n因此 \\(r_3\\ge r_1=r_2\\)。\n注意：\\(\\operatorname{tr}(ABXX^{\\mathsf T})=X^{\\mathsf T}ABX\\)，不能把题设简化成一个固定的 \\(\\operatorname{tr}(AB)\\) 数值；也不必假设 \\(AB\\) 对称。"},{"id":"20261113-math-07","subject":"线性代数","chapter":"二次型：正定性、合同与规范形","type":"选择题","question":"亚瑟精选模拟卷 · 第7题｜三阶实矩阵 \\(A\\) 满足 \\(A^2+2A=O\\)。求二次型\n\\[X^{\\mathsf T}(E+A)^{\\mathsf T}(E+A)X\\]\n的规范形。\nA. \\(y_1^2+y_2^2-y_3^2\\)；B. \\(y_1^2-y_2^2-y_3^2\\)；\nC. \\(y_1^2+y_2^2+y_3^2\\)；D. \\(-y_1^2-y_2^2-y_3^2\\)。","solution":"答案 C。\n由 \\(A^2+2A=O\\) 可得\n\\[(E+A)^2=E,\\]\n故 \\(E+A\\) 可逆。令 \\(Y=(E+A)X\\)，这是可逆线性变换，于是\n\\[X^{\\mathsf T}(E+A)^{\\mathsf T}(E+A)X=Y^{\\mathsf T}Y=y_1^2+y_2^2+y_3^2.\\]\n也可用正定性：非零 \\(X\\) 对应非零 \\((E+A)X\\)，其模长平方严格大于 0。\n易混点：不能无依据去掉转置，\\((E+A)^{\\mathsf T}(E+A)\\) 不一定等于 \\(E\\)；但它一定正定。"},{"id":"20261113-math-11","subject":"高等数学","chapter":"高阶导数：泰勒系数与莱布尼茨公式","type":"填空题","question":"亚瑟精选模拟卷 · 第11题｜设 \\(f(x)=(x^2-4x+3)^n\\)，求 \\(f^{(n)}(1)\\)。","solution":"答案 \\[f^{(n)}(1)=(-2)^n n!.\\]\n分解为 \\(f(x)=(x-1)^n(x-3)^n\\)。令 \\(t=x-1\\)，则 \\(f(1+t)=t^n(t-2)^n\\)，其中 \\(t^n\\) 的系数是 \\((-2)^n\\)。由泰勒公式，此系数等于 \\(f^{(n)}(1)/n!\\)，得到答案。\n也可用莱布尼茨公式：在 \\(x=1\\) 时，\\((x-1)^n\\) 求导不足 \\(n\\) 次仍为 0，只有全部 \\(n\\) 次导数都作用在该因子的一项保留：\n\\[f^{(n)}(1)=n!(1-3)^n=(-2)^n n!.\\]\n易混点：函数在该点为 0，并不意味着其第 \\(n\\) 阶导数也为 0。"},{"id":"20261113-math-14","subject":"高等数学","chapter":"第一类曲面积分：球面质量、对称性与投影法","type":"填空题","question":"亚瑟精选模拟卷 · 第14题｜曲面 \\(\\Sigma:x^2+y^2+z^2=2x\\)，面密度 \\(\\rho=x^2+y^2+z^2\\)，求曲面质量 \\(m\\)。","solution":"答案 \\[m=8\\pi.\\]\n方法一：对称性。球面为 \\((x-1)^2+y^2+z^2=1\\)，半径为 1。球面上 \\(\\rho=2x\\)，且关于 \\(x=1\\) 对称，故\n\\[m=2\\iint_\\Sigma x\\,dS=2\\iint_\\Sigma[(x-1)+1]\\,dS=2\\cdot4\\pi=8\\pi.\\]\n方法二：投影到 \\(yz\\) 平面。左右半球 \\(x_\\pm=1\\pm\\sqrt{1-y^2-z^2}\\) 的投影都是 \\(D:y^2+z^2\\le1\\)，且\n\\[dS=\\frac{dy\\,dz}{\\sqrt{1-y^2-z^2}}.\\]\n合并两半球：\n\\[m=\\iint_D\\frac{2x_++2x_-}{\\sqrt{1-y^2-z^2}}\\,dy\\,dz\n=4\\int_0^{2\\pi}d\\theta\\int_0^1\\frac{r}{\\sqrt{1-r^2}}\\,dr=8\\pi.\\]\n边界处按反常积分理解。\n易混点：这里是球面薄壳质量，不能用球体体积；左右半球的密度不同，不能只算一边再乘 2。"},{"id":"20261113-math-15","subject":"线性代数","chapter":"伴随矩阵、行列式与矩阵方程","type":"填空题","question":"亚瑟精选模拟卷 · 第15题｜设 \\(A\\) 的伴随矩阵\n\\[A^*=\\begin{pmatrix}1&0&0\\\\1&1&0\\\\1&1&1\\end{pmatrix},\\]\n三阶矩阵 \\(B\\) 满足 \\(A^{-1}BA+BA+2E=O\\)，求 \\(|B|\\)。","solution":"答案 \\[|B|=-1.\\]\n记 \\(M=A^*\\)，\\(d=|A|\\)。三阶矩阵满足 \\(|A^*|=|A|^2\\)，由 \\(|M|=1\\) 得 \\(d=\\pm1\\)，并有 \\(A^{-1}=M/d\\)。\n原式提取公因子：\n\\[(A^{-1}+E)BA=-2E.\\]\n右端可逆，故 \\(A^{-1}+E\\) 必可逆。若 \\(d=-1\\)，则 \\(A^{-1}+E=E-M\\) 是严格下三角矩阵，不可逆，矛盾。因此 \\(d=1\\)。\n此时 \\(A^{-1}=M\\)，\\(M+E\\) 的三个对角元均为 2，所以 \\(|M+E|=8\\)。对矩阵方程取行列式：\n\\[8|B|\\cdot1=|-2E|=(-2)^3=-8,\\]\n得到 \\(|B|=-1\\)。\n易混点：不能仅由 \\(|A|^2=1\\) 直接写 \\(|A|=1\\)，需要利用矩阵方程排除负号。"},{"id":"20261113-math-16","subject":"概率统计","chapter":"独立随机变量、指数分布与联合密度积分","type":"填空题","question":"亚瑟精选模拟卷 · 第16题｜\\(X,Y\\) 相互独立，\\(X\\) 在 \\((0,1)\\) 上均匀分布，\\(Y\\) 服从参数为 \\(\\lambda\\) 的指数分布，求 \\(P(1\\le Y/X\\le2)\\)。","solution":"答案 \\[\\frac{(1-e^{-\\lambda})^2}{2\\lambda}.\\]\n指数分布的概率密度为\n\\[f_Y(y)=\\begin{cases}\\lambda e^{-\\lambda y},&y>0,\\\\0,&y\\le0,\\end{cases}\\quad\\lambda>0.\\]\n而 \\(f_X(x)=1\\ (0\u003cx\u003c1)\\)，独立性给出联合密度 \\(f(x,y)=\\lambda e^{-\\lambda y}\\)（在 \\(0\u003cx\u003c1,y>0\\) 上）。\n因为 \\(X>0\\)，事件可改写为 \\(X\\le Y\\le2X\\)，所以固定 \\(x\\)，对 \\(y\\) 从 \\(x\\) 积到 \\(2x\\)：\n\\[\\begin{aligned}\nP&=\\int_0^1dx\\int_x^{2x}\\lambda e^{-\\lambda y}\\,dy\\\\\n&=\\int_0^1(e^{-\\lambda x}-e^{-2\\lambda x})\\,dx\\\\\n&=\\frac{1-e^{-\\lambda}}{\\lambda}-\\frac{1-e^{-2\\lambda}}{2\\lambda}\n=\\frac{(1-e^{-\\lambda})^2}{2\\lambda}.\n\\end{aligned}\\]\n易混点：\\(\\lambda e^{-\\lambda y}\\) 是密度，\\(1-e^{-\\lambda y}\\) 是 \\(y>0\\) 时的分布函数；二者不能混用。"}]</script><script>/* Temml — The MIT License (MIT)
