.backup{margin-left:auto;display:flex;gap:6px}.backup button{font-size:12px;padding:5px 8px}time{margin-left:8px}.warn{background:#ffedc1;padding:12px;border-radius:7px}@media(max-width:600px){header time{display:none}}</style><body><div id="root"><h1>拾知 · 本地复习工作台</h1><p>若只看到这行文字，请用支持 JavaScript 的浏览器打开此 HTML 文件。</p></div><script type="application/json" id="public-questions">[{"id":"20261109-signal-4","subject":"信号与系统","chapter":"冲激抽样、频谱周期延拓与重建","type":"综合计算题","question":"信号第 4 大题｜x(t)=2sin(4πt)+cos(3πt)，与周期冲激串 p(t)=Σₙδ(t−nT) 相乘，T=2/3 s，再依次通过 H₁、H₂。H₂ 为理想低通，通带增益 T，截止角频率 3.5π rad/s。① 是否发生混叠？② H₁(jω)=1 时求 xᵣ(t)。③ H₁(jω)=jω/2 时求 xᵣ(t)。","solution":"① 会。抽样角频率 ωₛ=2π/T=3π rad/s，原信号最高角频率为 4π。直接看样值也能确认：cos(3πnT)=1，2sin(4πnT)=2sin(2πn/3)，原余弦与直流具有相同样值，原正弦折叠到 π rad/s。\n\n② xᵣ(t)=1+2cos(3πt)+2sin(πt)−2sin(2πt)。\n先取一个基本频带，样值由 1+2sin(πt) 产生；抽样谱以 3π 为间隔重复。低通放行 |ω|≤3.5π，通带大于半个抽样角频率，所以还要数相邻副本。\n• 直流的副本落在 0、±3π，合起来是 1+2cos(3πt)。\n• 正弦的正、负频率谱线原在 +π、−π，两条线的系数互为相反数。平移后，−π+3π=2π，+π−3π=−2π，故又得到 −2sin(2πt)。最近的其余谱线 ±4π 被滤掉。\n• 抽样带来的 1/T 与低通增益 T 抵消。\n\n③ xᵣ(t)=πcos(πt)−2πcos(2πt)−3πsin(3πt)。\nH₁、H₂ 串联时频响相乘。相对于②多乘了 jω/2，时域就是将②的整个输出求导再除以 2；直流项导数为 0。"},{"id":"20261109-m34-02","subject":"高等数学","chapter":"无穷级数：递推数列与正项级数判敛","type":"选择题","question":"卷三十四 · 第 2 题｜u₀=0，uₙ₊₁=√(2+uₙ)。判定 Σₙ₌₁^∞ (−1)ⁿ√(2−uₙ) 的敛散性。A 条件收敛；B 绝对收敛；C 发散；D 无法判断。","solution":"答案 B，绝对收敛。\n由递推归纳得 0≤uₙ\u003c2。去掉交错符号，令 aₙ=√(2−uₙ)>0。用平方差改写：\n(2−uₙ₊₁)(2+uₙ₊₁)=4−uₙ₊₁²=2−uₙ。\n故 aₙ₊₁/aₙ=1/√(2+uₙ₊₁)≤1/√2\u003c1。于是 aₙ≤a₁(1/√2)ⁿ⁻¹，与收敛的几何级数比较可知 Σaₙ 收敛，原级数绝对收敛。只用莱布尼茨判别法能够证明收敛，但还不足以区分 A、B。"},{"id":"20261109-m34-04","subject":"微分方程","chapter":"一阶线性微分方程与极值判定","type":"选择题","question":"卷三十四 · 第 4 题｜y=f(x) 满足 y′−P(x)y=eˣ/2−1，y(0)=1，P(x)=∫₀¹|x−t|dt。判断：A 在 0 处取极大值；B 在 0 处取极小值；C (0,f(0)) 为拐点；D 两者均非。","solution":"答案 A，x=0 为严格极大值点。\n① P(0)=1/2，代回原方程得 y′(0)=1/2+1/2−1=0。\n② x\u003c0 时，P(x)=1/2−x；0≤x≤1 时，在 t=x 处分段积分得 P(x)=x²−x+1/2。两侧给出 P′(0)=−1。\n③ 原方程求导：y″=P′y+Py′+eˣ/2，所以 y″(0)=−1×1+(1/2)×0+1/2=−1/2\u003c0。结合 y′(0)=0 得到严格极大值，无需求通解。"},{"id":"20261109-m34-06","subject":"线性代数","chapter":"幂零矩阵、秩与非齐次方程组","type":"选择题","question":"卷三十四 · 第 6 题｜A 为 3 阶非零矩阵，b 为 3 维非零列向量，A²=O。非齐次方程组 AᵀAx=Aᵀb 线性无关的解向量的个数为？A 1；B 2；C 3；D 4。","solution":"答案 C，最多能取 3 个线性无关的解向量（按题干“非齐次”即 Aᵀb≠0）。\n① A²=O ⇒ Im(A)⊆Ker(A)。设 r(A)=r，则 r≤3−r；又 A≠O，故 r=1。\n② 对实矩阵，AᵀAx=0 ⇒ xᵀAᵀAx=‖Ax‖²=0 ⇒ Ax=0，故对应齐次解空间维数为 3−1=2。又 Im(AᵀA)=Im(Aᵀ)（前者包含于后者且秩相等），所以方程有特解 p。\n③ 设 u、v 是齐次解空间的一组基。AᵀAp≠0，说明 p 不在 span(u,v) 中。在非齐次解中取 p、p+u、p+v：若三者有线性关系，整理后得到 p、u、v 的线性关系，系数只能全为 0。故能取 3 个，且三维空间中至多 3 个。\n题干细节：单凭 b≠0 推不出 Aᵀb≠0；若去掉“非齐次”条件且 Aᵀb=0，最多只能取 2 个。"},{"id":"20261109-m34-13","subject":"高等数学","chapter":"傅里叶级数：周期与余弦系数","type":"填空题","question":"卷三十四 · 第 13 题｜f(x)=x²（0≤x\u003c1），f(x)=2−x（1≤x≤2）。傅里叶级数写作 a₀/2+Σₙ₌₁^∞[aₙcos(nπx)+bₙsin(nπx)]。求 a₂。","solution":"答案 a₂=1/(2π²)。\n基频为 π，一个周期长 T=2，系数前的因子 2/T=1。令 k=2π，则 a₂=∫₀¹x²cos(kx)dx+∫₁²(2−x)cos(kx)dx。\n第一段分部积分两次，原函数为 x²sin(kx)/k+2x cos(kx)/k²−2sin(kx)/k³。代入 0、1 得 2/k²。\n第二段原函数为 (2−x)sin(kx)/k−cos(kx)/k²。代入 1、2，由 sin(2π)=sin(4π)=0、cos(2π)=cos(4π)=1，得 0。\n两段相加为 2/(2π)²=1/(2π²)。注意 n=2 时应代入 cos(2πx)。"}]</script><script>(()=>{var fL=Object.create;var Kn=Object.defineProperty;var oL=Object.getOwnPropertyDescriptor;var dL=Object.getOwnPropertyNames;var sL=Object.getPrototypeOf,nL=Object.prototype.hasOwnProperty;var Te=(a,e)=>()=>(e||a((e={exports:{}}).exports,e),e.exports);var iL=(a,e,t,l)=>{if(e&&typeof e=="object"||typeof e=="function")for(let u of dL(e))!nL.call(a,u)&&u!==t&&Kn(a,u,{get:()=>e[u],enumerable:!(l=oL(e,u))||l.enumerable});return a};var Ot=(a,e,t)=>(t=a!=null?fL(sL(a)):{},iL(e||!a||!a.__esModule?Kn(t,"default",{value:a,enumerable:!0}):t,a));var di=Te(B=>{"use strict";var Jo=Symbol.for("react.transitional.element"),rL=Symbol.for("react.portal"),cL=Symbol.for("react.fragment"),mL=Symbol.for("react.strict_mode"),pL=Symbol.for("react.profiler"),LL=Symbol.for("react.consumer"),hL=Symbol.for("react.context"),xL=Symbol.for("react.forward_ref"),SL=Symbol.for("react.suspense"),gL=Symbol.for("react.memo"),ei=Symbol.for("react.lazy"),CL=Symbol.fo
